<!doctype html>
<html lang="{{LANGUAGE}}">
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      width: {{WIDTH}}px;
      height: {{HEIGHT}}px;
      margin: 0;
      overflow: hidden;
    }
    * { box-sizing: border-box; }
    body {
      background: #ffffff;
      color: #182231;
      font-family: Arial, sans-serif;
    }
    .slide {
      width: {{WIDTH}}px;
      height: {{HEIGHT}}px;
      padding: 48px;
      overflow: hidden;
    }
    .kicker {
      margin: 0 0 16px;
      color: #234f79;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    h1 {
      margin: 0 0 24px;
      font-size: 36px;
      color: #234f79;
      border-bottom: 4px double #234f79;
      padding-bottom: 16px;
      line-height: 1.12;
    }
    .message {
      max-width: 900px;
      margin: 0;
      font-size: 22px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="slide">

    <h1>Replace with the numbered paper section heading</h1>
    <p class="message">Replace with source-supported explanation and grouped original paper figures.</p>
  </main>
</body>
</html>
